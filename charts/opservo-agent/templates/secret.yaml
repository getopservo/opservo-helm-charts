{{- if not .Values.enrollment.existingSecret }}
{{- if not .Values.enrollment.token }}
{{- fail "Set enrollment.token (Opservo → Add server → Kubernetes cluster) or enrollment.existingSecret." }}
{{- end }}
{{- if not (hasPrefix "https://" .Values.enrollment.apiUrl) }}
{{- fail "enrollment.apiUrl must be https://" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: opservo-k8s-agent-enroll
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opservo-agent.labels" . | nindent 4 }}
type: Opaque
data:
  OPSERVO_API_URL: {{ .Values.enrollment.apiUrl | b64enc | quote }}
  OPSERVO_TOKEN: {{ .Values.enrollment.token | b64enc | quote }}
  OPSERVO_CLUSTER_NAME: {{ .Values.enrollment.clusterName | b64enc | quote }}
{{- end }}
